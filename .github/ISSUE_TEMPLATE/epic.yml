name: Epic
description: A coherent feature, whose work is attached as sub-issues.
title: "[epic] "
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        Attach the work as sub-issues rather than listing it here: the board then reads at epic level,
        the progress rollup comes for free, and nothing hides behind a summary.
  - type: textarea
    id: what
    attributes:
      label: What it is
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The state of the app that makes this epic closable.
    validations:
      required: true
